schema_version: "1.1"
name: spec-ACME-11
description: Stage 2. Write the Playwright spec for ACME-11 from its approved Test Steps. Hard checks (spec rules, tsc, --list) run in evals/check.py.
tags: [spec]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "The Test Steps for ACME-11 on the Acme Support project are approved (test-steps/ACME-11.md). Write the Playwright spec for it in tests/. Don't run it against an org."
  max_turns: 60
  timeout_seconds: 1200
  allowed_tools: [Read, Glob, Grep, Write, Edit, Skill, "Bash(npx playwright test --list:*)"]
runs: 3
graders:
  - type: file_exists
    name: spec-written
    path: tests/ACME-11.spec.ts
  - type: regex
    name: no-skipped-tests
    target: {source: file, path: tests/ACME-11.spec.ts}
    pattern: "test\\.(skip|fixme|only)"
    match: not_contains
  - type: llm
    name: checks-match-expected
    focus: {source: file, path: tests/ACME-11.spec.ts}
    criteria: >-
      This is a Playwright spec written from these approved Test Steps: 1. Build check [Build check] Compare the org with the build sub-task's spec (ACME-11-build): the Contact Channel field and its four values, its place on the Support Request page, the Support Agent permission set's access, and the Cases by Contact Channel report. Flow F1, as Support Agent Test User 2. Create a Support Request, pick Email as the Contact Channel and save. Expected: the case saves with Contact Channel Email. Criterion 1. [Video] 3. Open the Cases by Contact Channel report from Support Reports. Expected: the new case is counted under Email. Criterion 3. [Video] 4. Query the Support Agent permission set's access to Contact Channel. Expected: read and edit. Criterion 4. [Query]
      Judge each step after step 1 (step 1, the build check, isn't in the spec). Pass if every step's assertions
      check its expected result as written, not something easier (for example, checking a save button exists when
      the expected result is that the save is stopped with a message). Fail if any step's assertions don't prove
      its expected result.
  - type: tool_used
    name: skill-fired
    tool: Skill
    arm: with-only
