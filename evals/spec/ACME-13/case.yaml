schema_version: "1.1"
name: spec-ACME-13
description: Stage 2. Write the Playwright spec for ACME-13 from its approved Test Steps. Hard checks (spec rules, tsc, --list) run in evals/check.py.
tags: [spec]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "The Test Steps for ACME-13 on the Acme Support project are approved (test-steps/ACME-13.md). Write the Playwright spec for it in tests/. Don't run it against an org."
  max_turns: 60
  timeout_seconds: 1200
  allowed_tools: [Read, Glob, Grep, Write, Edit, Skill, "Bash(npx playwright test --list:*)"]
runs: 3
graders:
  - type: file_exists
    name: spec-written
    path: tests/ACME-13.spec.ts
  - type: regex
    name: no-skipped-tests
    target: {source: file, path: tests/ACME-13.spec.ts}
    pattern: "test\\.(skip|fixme|only)"
    match: not_contains
  - type: tool_used
    name: skill-fired
    tool: Skill
    arm: with-only
