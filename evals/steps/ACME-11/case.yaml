schema_version: "1.1"
name: steps-ACME-11
description: Stage 1. Draft the QA sub-task's Test Steps for ACME-11 from its story. Hard checks run in evals/check.py.
tags: [steps]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "You're on the Acme Support project (project.md). Story ACME-11 is built and ready for QA; its build sub-task is in builds/. Draft the Test Steps for its QA sub-task and save them to qa-steps/ACME-11.md."
  max_turns: 30
  timeout_seconds: 1200
  allowed_tools: [Read, Glob, Grep, Write, Skill]
runs: 3
graders:
  - type: file_exists
    name: draft-written
    path: qa-steps/ACME-11.md
  - type: regex
    name: has-coverage
    target: {source: file, path: qa-steps/ACME-11.md}
    pattern: "^\\W*coverage"
    flags: im
  - type: llm
    name: plain-and-in-scope
    focus: {source: file, path: qa-steps/ACME-11.md}
    criteria: >-
      These are QA Test Steps drafted for story ACME-11, for a person to approve. The story's acceptance criteria are: 1. A support agent can pick a Contact Channel when creating a Support Request, and it saves with the case. 2. Contact Channel offers exactly these values: Phone, Email, Chat, Web. 3. The "Cases by Contact Channel" report in Support Reports groups cases by Contact Channel, and a new case shows up under its channel. 4. The Support Agent permission set gives edit access to Contact Channel. Judge only the numbered steps and the
      Coverage section; notes to the approver are allowed and not judged. Step 1 is the build check: it may list
      everything the build sub-task adds, with API names. [Query] steps may name objects, settings and access, since nothing runs as a user there. Pass if all of these
      hold: (1) the steps a user performs (in a flow, or tagged [Video] or [Screenshot]) use plain words a business
      user would recognise; (2) no step tests something the story's acceptance criteria don't ask for, such as
      changing Setup, standard Salesforce behaviour or another story's work (checking by query that a configured
      access or setting exists is not changing Setup); (3) each step's expected result matches the criterion it names. Fail if any one does not
      hold.
  - type: tool_used
    name: skill-fired
    tool: Skill
    arm: with-only
